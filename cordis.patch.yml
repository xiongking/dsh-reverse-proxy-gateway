# dsh-reverse-proxy-gateway bundle layer.
#
# 这一行就是插件的全部默认配置：改完需要重启 DSH 生效。
# 行名必须与 package.json 的 name 完全一致（DSH 按它解析到包目录）。
# required: false —— 插件运行时出错时宿主跳过它，而不是让整个 DSH 起不来。
#
# 安装后如果要把配置改成自己的，请在 profile 的 cordis.patch.yml 里追加一段：
#
#   - id: reverse-proxy-gateway
#     config:
#       port: 3080
#       publicUrl: "https://dsh.example.com/"
#       username: dsh
#       password: "your-password"
#       accessToken: "your-fixed-token"
#
# 注意 patch 的 config 是整块替换：上面没写的字段会回到本文件的默认值。
- insert:
    - id: reverse-proxy-gateway
      name: "dsh-reverse-proxy-gateway"
      required: false
      config:
        enabled: true
        listen: "0.0.0.0"
        port: 3080
        publicUrl: ""
        username: "dsh"
        password: ""
        accessToken: ""
        cookieDays: 30
        # 远程浏览器打开「创建工作区」时，用网关自带的目录浏览器代替主机的系统对话框。
        remotePicker: true
        # 目录浏览的上界：留空表示当前用户的主目录；填绝对路径可收窄或放宽浏览范围。
        # 它只定上界，打开时仍从家目录开始，可以逐级往上退到这里。
        browseRoot: ""
